<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kai Voxel Room</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10131b;color:#f5f7ff;font:15px system-ui,sans-serif}canvas{display:block}#ui{position:fixed;z-index:5;top:14px;left:14px;width:min(340px,calc(100vw - 28px));padding:16px;border:1px solid #ffffff22;border-radius:16px;background:#101521eF;box-shadow:0 14px 40px #0008}h1{font-size:20px;margin:0 0 6px}p{color:#aab4c8;line-height:1.45;margin:7px 0 12px}label{display:block;font-size:12px;color:#aab4c8;margin:10px 0 5px}input{width:100%;padding:11px;border:1px solid #39445a;border-radius:9px;background:#080d17;color:white}button{border:0;border-radius:9px;padding:11px 14px;background:#7c5cff;color:white;font-weight:800;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.row{display:flex;gap:8px;margin-top:10px}.row button{flex:1}#status{font-size:13px;color:#c4cce0;min-height:20px}#local-video,#remote-video{position:fixed;z-index:4;bottom:14px;width:clamp(100px,18vw,180px);aspect-ratio:4/3;object-fit:cover;background:#05070b;border:1px solid #ffffff33;border-radius:12px}#local-video{right:14px}#remote-video{right:calc(clamp(100px,18vw,180px) + 26px)}.hint{font-size:12px;color:#8e9bb5;margin-top:10px}@media(max-width:520px){#ui{top:8px;left:8px;padding:12px;width:calc(100vw - 16px)}#local-video{right:8px;bottom:8px}#remote-video{right:calc(clamp(100px,18vw,180px) + 18px);bottom:8px}}
</style>
</head>
<body>
<section id="ui">
 <h1>🧊 Kai Voxel Room</h1>
 <p>Join the same room to explore a tiny shared 3D space and talk with your friend.</p>
 <div id="setup">
  <label for="room-input">ROOM NAME</label>
  <input id="room-input" maxlength="32" placeholder="kai-and-me" autocomplete="off">
  <div class="row"><button id="join-button">Join room</button></div>
 </div>
 <div id="live" hidden>
  <div>Room: <b id="room-display"></b></div>
  <p id="net-status" role="status">Connecting…</p>
  <button id="leave-button" type="button">Leave room</button>
  <div class="hint">WASD to move · Move around the grid · Camera/mic need permission</div>
 </div>
</section>
<video id="local-video" autoplay muted playsinline hidden></video>
<video id="remote-video" autoplay playsinline hidden></video>
<script>
const $=id=>document.getElementById(id);
let peer=null,dataConn=null,localStream=null,mediaCall=null,roomName="",isHost=false;
let scene,camera,renderer,myBox,friendBox,keys={},lastSync=0;
function status(message){$("net-status").textContent=message;}
function cleanRoom(value){return value.trim().toLowerCase().replace(/[^a-z0-9-]/g,"-").replace(/-+/g,"-").replace(/^-|-$/g,"").slice(0,32);}
function showLive(){ $("setup").hidden=true;$("live").hidden=false;$("room-display").textContent=roomName; }
async function startLobby(){
 roomName=cleanRoom($("room-input").value);
 if(roomName.length<3){alert("Use a room name with at least 3 letters or numbers.");return;}
 if(!window.Peer||!window.THREE){alert("PeerJS or Three.js did not load. Check your internet connection and reload.");return;}
 $("join-button").disabled=true;status("Requesting camera and microphone permission…");
 try{
  if(!navigator.mediaDevices?.getUserMedia)throw new Error("Camera/microphone access requires HTTPS and a supported browser.");
  localStream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});
  $("local-video").srcObject=localStream;$("local-video").hidden=false;
  showLive();initWorld();
  startHostAttempt();
 }catch(e){status(e.message||"Could not access camera or microphone.");$("join-button").disabled=false;localStream?.getTracks().forEach(t=>t.stop());localStream=null;}
}
function peerConfig(){return {debug:1,config:{iceServers:[{urls:"stun:stun.l.google.com:19302"},{urls:"stun:stun1.l.google.com:19302"}]}};}
function startHostAttempt(){
 status("Checking whether this room is available…");
 peer=new Peer("kai-voxel-"+roomName,peerConfig());
 peer.on("open",()=>{isHost=true;status("You created the room. Send the same room name to your friend.");});
 peer.on("connection",conn=>attachData(conn));
 peer.on("call",call=>{call.answer(localStream);attachCall(call);});
 peer.on("error",error=>{
  if(error.type==="unavailable-id"){peer.destroy();startAsGuest();return;}
  status("Connection error: "+(error.message||error.type||"unknown error"));
 });
}
function startAsGuest(){
 status("Room found. Connecting as guest…");
 peer=new Peer(peerConfig());
 peer.on("open",()=>{
  dataConn=peer.connect("kai-voxel-"+roomName,{reliable:true});
  dataConn.on("open",()=>{
   attachData(dataConn);
   mediaCall=peer.call("kai-voxel-"+roomName,localStream);
   if(mediaCall)attachCall(mediaCall);
   status("Connected to room host.");
  });
  dataConn.on("error",e=>status("Data connection failed: "+e.message));
 });
 peer.on("call",call=>{call.answer(localStream);attachCall(call);});
 peer.on("error",error=>status("Peer connection error: "+(error.message||error.type||"unknown error")));
}
function attachData(conn){
 dataConn=conn;
 conn.on("data",data=>{
  if(!data||!friendBox||!Number.isFinite(data.x)||!Number.isFinite(data.z))return;
  friendBox.position.set(data.x,data.y||0.5,data.z);friendBox.visible=true;
 });
 conn.on("open",()=>{status(isHost?"Friend connected!":"Connected to room host.");});
 conn.on("close",()=>{friendBox&&(friendBox.visible=false);status("Friend disconnected.");});
 conn.on("error",e=>status("Data error: "+e.message));
}
function attachCall(call){
 mediaCall=call;
 call.on("stream",stream=>{$("remote-video").srcObject=stream;$("remote-video").hidden=false;status("Voice and video connected.");});
 call.on("close",()=>{$("remote-video").srcObject=null;$("remote-video").hidden=true;});
 call.on("error",e=>status("Media call error: "+e.message));
}
function initWorld(){
 scene=new THREE.Scene();scene.background=new THREE.Color(0x151d2c);
 camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,1000);
 renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);
 scene.add(new THREE.HemisphereLight(0xffffff,0x36415a,2));
 const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(4,8,5);scene.add(light);
 const floor=new THREE.Mesh(new THREE.PlaneGeometry(60,60),new THREE.MeshStandardMaterial({color:0x202c3d,roughness:.9}));floor.rotation.x=-Math.PI/2;floor.position.y=-.03;scene.add(floor);
 const grid=new THREE.GridHelper(60,60,0x62708d,0x354158);scene.add(grid);
 myBox=new THREE.Mesh(new THREE.BoxGeometry(1,1,1),new THREE.MeshStandardMaterial({color:0x55e6a5,roughness:.55}));myBox.position.y=.5;scene.add(myBox);
 friendBox=new THREE.Mesh(new THREE.BoxGeometry(1,1,1),new THREE.MeshStandardMaterial({color:0xff718b,roughness:.55}));friendBox.position.y=.5;friendBox.visible=false;scene.add(friendBox);
 camera.position.set(0,5,8);window.addEventListener("resize",resizeWorld);animate();
}
function resizeWorld(){if(!camera||!renderer)return;camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);}
function animate(now=0){
 requestAnimationFrame(animate);if(!renderer)return;
 const speed=.12;
 if(keys.w||keys.arrowup)myBox.position.z-=speed;
 if(keys.s||keys.arrowdown)myBox.position.z+=speed;
 if(keys.a||keys.arrowleft)myBox.position.x-=speed;
 if(keys.d||keys.arrowright)myBox.position.x+=speed;
 myBox.position.x=Math.max(-28,Math.min(28,myBox.position.x));myBox.position.z=Math.max(-28,Math.min(28,myBox.position.z));
 camera.position.lerp(new THREE.Vector3(myBox.position.x,5,myBox.position.z+8),.08);camera.lookAt(myBox.position);
 if(dataConn?.open&&now-lastSync>50){lastSync=now;dataConn.send({x:myBox.position.x,y:myBox.position.y,z:myBox.position.z});}
 renderer.render(scene,camera);
}
function leaveRoom(){
 try{mediaCall?.close();dataConn?.close();peer?.destroy();}catch{}
 localStream?.getTracks().forEach(t=>t.stop());localStream=null;peer=null;dataConn=null;mediaCall=null;
 $("local-video").srcObject=null;$("local-video").hidden=true;$("remote-video").srcObject=null;$("remote-video").hidden=true;
 if(renderer){renderer.dispose();renderer.domElement.remove();renderer=null;}
 $("live").hidden=true;$("setup").hidden=false;$("join-button").disabled=false;status("Left room.");
}
$("join-button").addEventListener("click",startLobby);
$("leave-button").addEventListener("click",leaveRoom);
$("room-input").addEventListener("keydown",e=>{if(e.key==="Enter")startLobby();});
window.addEventListener("keydown",e=>{keys[e.key.toLowerCase()]=true;if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key))e.preventDefault();});
window.addEventListener("keyup",e=>{keys[e.key.toLowerCase()]=false;});
window.addEventListener("beforeunload",()=>localStream?.getTracks().forEach(t=>t.stop()));
</script>
</body>
</html>
