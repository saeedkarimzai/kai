<!DOCTYPE html><html><head><style></style></head><body><!DOCTYPE html>
<html>
<head>
    <title>Auto-Connect Voxel</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #111; font-family: sans-serif; color: white; }
        #ui { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.8); padding: 15px; border-radius: 10px; z-index: 10; border: 1px solid #444; }
        video { width: 120px; position: absolute; bottom: 10px; right: 10px; border-radius: 10px; background: #000; }
        #remote-video { right: 140px; }
        input { padding: 8px; border-radius: 5px; border: none; }
        button { padding: 8px; cursor: pointer; background: #28a745; color: white; border: none; border-radius: 5px; }
    </style>
</head>
<body>

    <div id="ui">
        <div id="setup">
            <h3>Enter Room Name:</h3>
            <input type="text" id="room-input" placeholder="e.g. kai-and-me">
            <button onclick="startLobby()">Join Room</button>
        </div>
        <div id="status" style="display:none;">
            <p>Room: <b id="room-display"></b></p>
            <p id="net-status">Waiting for friend...</p>
            <small>WASD to Move | Click to Build</small>
        </div>
    </div>

    <video id="local-video" autoplay muted></video>
    <video id="remote-video" autoplay></video>

    <script>
        let peer, dataConn, localStream;
        const roomInput = document.getElementById('room-input');
        
        // --- AUTO-JOIN LOGIC ---
        function startLobby() {
            const roomName = roomInput.value.trim().toLowerCase();
            if (!roomName) return alert("Enter a room name!");
            
            location.hash = roomName; // Put room name in URL
            initPeer(roomName);
        }

        // Check if room is already in URL on load
        if (location.hash) {
            roomInput.value = location.hash.substring(1);
            startLobby();
        }

        function initPeer(roomName) {
            document.getElementById('setup').style.display = 'none';
            document.getElementById('status').style.display = 'block';
            document.getElementById('room-display').innerText = roomName;

            // Use Room Name as the ID prefix
            // Host will be "roomName-host", Joiner will be "roomName-guest"
            peer = new Peer(null, {
                config: {'iceServers': [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' }]}
            });

            peer.on('open', (myId) => {
                console.log("My ID is: " + myId);
                // Attempt to connect to anyone already in the room
                // In a real "ez" setup, we just broadcast/search or use a fixed naming convention
                // For this, we'll try to connect to a specific "Host" ID
                findFriend(roomName);
            });

            peer.on('connection', (conn) => {
                dataConn = conn;
                setupData();
                document.getElementById('net-status').innerText = "Friend Connected!";
            });

            peer.on('call', call => {
                call.answer(localStream);
                call.on('stream', s => document.getElementById('remote-video').srcObject = s);
            });
        }

        async function findFriend(roomName) {
            // Logic: Try to connect to 'roomName'. If it fails, I AM 'roomName'.
            // This is a simple "First one is Host" trick.
            const conn = peer.connect(roomName);
            conn.on('open', () => {
                dataConn = conn;
                setupData();
                document.getElementById('net-status').innerText = "Connected to Host!";
                peer.call(roomName, localStream);
            });
            
            // If we are the first one, we NEED to be the one with the ID 'roomName'
            // So we recreate the peer with that specific name
            peer.on('error', (err) => {
                if (err.type === 'peer-unavailable') {
                    peer.destroy();
                    peer = new Peer(roomName, {
                        config: {'iceServers': [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' }]}
                    });
                    initPeerLogic();
                }
            });
        }

        function initPeerLogic() {
            peer.on('open', () => document.getElementById('net-status').innerText = "You are the Host. Send link to friend!");
            peer.on('connection', (conn) => {
                dataConn = conn;
                setupData();
                document.getElementById('net-status').innerText = "Guest Joined!";
            });
            peer.on('call', call => {
                call.answer(localStream);
                call.on('stream', s => document.getElementById('remote-video').srcObject = s);
            });
        }

        // --- 3D ENGINE (Same as Minecraft version) ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const myBox = new THREE.Mesh(new THREE.BoxGeometry(), new THREE.MeshStandardMaterial({color: 0x00ff00}));
        scene.add(myBox);
        const friendBox = new THREE.Mesh(new THREE.BoxGeometry(), new THREE.MeshStandardMaterial({color: 0xff0000}));
        friendBox.visible = false;
        scene.add(friendBox);

        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(5, 5, 5);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x404040));
        scene.add(new THREE.GridHelper(20, 20));
        camera.position.set(0, 5, 10);

        // --- CONTROLS & SYNC ---
        const keys = {};
        window.onkeydown = (e) => keys[e.key.toLowerCase()] = true;
        window.onkeyup = (e) => keys[e.key.toLowerCase()] = false;

        navigator.mediaDevices.getUserMedia({video: true, audio: true}).then(s => {
            localStream = s;
            document.getElementById('local-video').srcObject = s;
        });

        function setupData() {
            dataConn.on('data', data => {
                friendBox.visible = true;
                friendBox.position.set(data.x, data.y, data.z);
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            if(keys['w']) myBox.position.z -= 0.1;
            if(keys['s']) myBox.position.z += 0.1;
            if(keys['a']) myBox.position.x -= 0.1;
            if(keys['d']) myBox.position.x += 0.1;

            camera.lookAt(myBox.position);
            if (dataConn && dataConn.open) {
                dataConn.send({x: myBox.position.x, y: myBox.position.y, z: myBox.position.z});
            }
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
<script>import express from "express";
import fetch from "node-fetch";

const app = express();
app.use(express.json());

const OPENAI_KEY = process.env.OPENAI_KEY; // NEVER hardcode

app.post("/chat", async (req, res) => {
  const userMessage = req.body.message;

  const response = await fetch("https://api.openai.com/v1/chat/completions", {
    method: "POST",
    headers: {
      "Authorization": `Bearer ${OPENAI_KEY}`,
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      model: "gpt-5",
      messages: [{ role: "user", content: userMessage }]
    })
  });

  const data = await response.json();
  res.json({ reply: data.choices[0].message.content });
});

app.listen(3000, () => console.log("ChatGPT running"));
</script></body></html>
